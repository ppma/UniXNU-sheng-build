name: package

# 基于 ppma/UniXNU-sheng (Gitee 镜像) 的 .github/workflows/package.yml 修改。
# 改动清单（相对上游原文件）：
#   1. workflow_dispatch.inputs.os.options 增加 "macos-27"（上游只有 27/26/17，出不了 macOS 包）
#   2. Data seed 的 cache / 导入 / 备份路径改为通配，兼容 macOS 输出目录
#      out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr
#   3. 所有 "inputs.os == '27'" 的种子相关条件放宽为 27 或 macos-27
#   4. prepare preserved Data seed 按 profile 解析 seed 路径
#   5. --init-data 仍只对 iPadOS 27 生效（官方注明 iPadOS 27 only）
#
# 使用前必读（README 第 6 节）：
#   - 首次 macOS 构建必须先在【本地 Mac】以 root 制作 data.dbr，再把它放到 HTTPS URL，
#     运行 workflow 时填 data_seed_url + data_seed_sha256。CI 无法从零生成 macOS seed。
#   - 镜像绑定单台设备：下载 artifact 后删除该 run。
#   - 此改动未在本环境实跑验证；首次从零构建请优先走本地 Mac 路线。

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "macos-27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 ONLY; macOS seed must be made locally)"
        type: boolean
        default: false
      data_seed_url:
        description: "HTTPS URL of the ORIGINAL data.dbr for an existing installation (required for first macOS build)"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive

      # 国内化时把下面两个 repository 换成你自己的 Gitee 镜像地址（完整 URL）。
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 82b847c4ac3f68a57024b3082ffa3a03442defd9 # Wi-Fi runtime and Data firmware integration
          path: UniXNU
          submodules: recursive
      # 2026-11-18: uefi-sheng 已镜像到 Gitee，HEAD 与上游一致 (b303410c...)
      - uses: actions/checkout@v4
        with:
          repository: https://gitee.com/ppma/uefi-sheng.git
          path: uefi-sheng
          submodules: recursive

      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]

      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi

      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY

      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27' || inputs.os == 'macos-27'
        with:
          # 通配同时覆盖 ipados-27.0.1-24A446/sheng_ipados27 与
          # macos-27.3-26C5035r/sheng_macos；cache key 含 inputs.os，两个 profile 不会串。
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}

      - name: prepare preserved Data seed
        if: inputs.os == '27' || inputs.os == 'macos-27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          profile = os.environ['OS_PROFILE']
          seed_paths = {
              '27':       'UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr',
              'macos-27': 'UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime/data.dbr',
          }
          path = pathlib.Path(seed_paths[profile])
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              if profile == 'macos-27':
                  raise SystemExit('No macOS Data seed. Make one on a local Mac with sudo scripts/make-macos-data-seed.py, '
                                   'then supply its HTTPS URL and SHA-256 (init_data is iPadOS 27 only).')
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY

      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"

      # package.sh 不产 userdata 镜像。macOS 是三窗口 userdata 根卷布局，
      # 首次启动前还需要 ./unixnu build userdata --os macos-27 生成的
      # userdata-root.img，并 fastboot flash userdata。CI 产物里没有它。

      - uses: actions/cache/save@v4
        if: always() && (inputs.os == '27' || inputs.os == 'macos-27') && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/*/*/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}

      - name: installation seed backup
        if: always() && (inputs.os == '27' || inputs.os == 'macos-27') && hashFiles('UniXNU/out/sheng/*/*/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json

      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
